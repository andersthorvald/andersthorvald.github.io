  <style>
    /* === About 页专属样式（基于 design-system） === */
    .page-wrap {
      max-width: 720px; margin: 0 auto; padding: 48px 32px 80px;
      position: relative; z-index: 1;
    }
    .profile-card {
      background: var(--bg-elevated);
      border: 1px solid var(--border);
      border-radius: var(--r-xl);
      padding: 48px 40px;
      box-shadow: var(--sh-md);
      text-align: center;
    }
    .profile-avatar-wrap { margin-bottom: 20px; }
    .profile-avatar {
      width: 110px; height: 110px; border-radius: 50%;
      object-fit: cover;
      border: 4px solid rgba(255,154,158,0.35); padding: 3px;
      background: linear-gradient(135deg, var(--accent-from), var(--accent-to));
    }
    .profile-name {
      font-family: var(--f-display);
      font-size: 1.8em; font-weight: 800;
      letter-spacing: -0.02em;
      color: var(--text-primary);
      margin-bottom: 6px;
    }
    .profile-role {
      font-size: 0.9em; color: var(--text-muted);
      font-weight: 500; margin-bottom: 24px;
    }

    .interests {
      display: flex; flex-wrap: wrap; gap: 8px;
      justify-content: center; margin-bottom: 28px;
    }
    .interest-tag {
      padding: 6px 14px; border-radius: var(--r-full);
      font-size: 0.82em; font-weight: 500;
      background: var(--neutral-bg);
      color: var(--text-secondary);
      transition: all 0.2s var(--ease-out);
    }
    .interest-tag:hover {
      background: var(--accent-soft);
      color: var(--accent-solid);
    }

    .profile-bio {
      color: var(--text-secondary);
      font-size: 0.95em; line-height: 1.8;
      max-width: 500px; margin: 0 auto 24px;
    }
    .profile-motto {
      font-style: italic; color: var(--text-muted);
      font-size: 0.9em; padding-top: 20px;
      margin-top: 20px;
      border-top: 1px solid var(--border);
    }

    /* Social links */
    .social-links {
      display: flex; flex-wrap: wrap; gap: 10px;
      justify-content: center; margin-top: 32px;
    }
    .social-link {
      display: flex; flex-direction: column; align-items: center; gap: 6px;
      padding: 14px 16px; border-radius: var(--r-lg);
      background: var(--bg-elevated);
      border: 1px solid var(--border);
      text-decoration: none; color: var(--text-primary);
      font-size: 0.74em; font-weight: 600;
      transition: all 0.25s var(--ease-out);
      min-width: 80px;
    }
    .social-link:hover {
      transform: translateY(-3px);
      box-shadow: var(--sh-md);
      color: white;
      border-color: transparent;
    }
    .social-link svg { width: 24px; height: 24px; transition: transform 0.2s; }
    .social-link:hover svg { transform: scale(1.1); }
    .social-link.wechat:hover   { background: #07c160; }
    .social-link.bilibili:hover { background: #00a1d6; }
    .social-link.youtube:hover  { background: #ff0000; }
    .social-link.github:hover   { background: #24292e; }
    .social-link.x:hover       { background: #000; }
    .social-link.email:hover    { background: var(--accent-solid); }
    .social-link.home:hover     { background: var(--text-primary); }

    /* 隐藏旧粒子层（v2 不需要） */
    .particles, .dot-grid, .blob { display: none; }

    /* QR modal（保留） */
    .qr-modal {
      display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.6); align-items: center; justify-content: center;
      z-index: 2000; backdrop-filter: blur(4px);
    }
    .qr-modal.active { display: flex; }
    .qr-modal-content {
      background: var(--bg-elevated); border-radius: var(--r-xl);
      padding: 32px; text-align: center;
      max-width: 90%; animation: qr-pop 0.25s var(--ease-spring);
    }
    @keyframes qr-pop {
      from { opacity: 0; transform: scale(0.92); }
      to   { opacity: 1; transform: scale(1); }
    }
    .qr-modal h3 {
      margin: 0 0 16px; color: var(--text-primary);
      font-family: var(--f-display); font-size: 1.2em; font-weight: 700;
    }
    .qr-modal img {
      max-width: 220px; border-radius: var(--r-md);
      border: 3px solid rgba(255,154,158,0.3);
    }
    .qr-modal p { color: var(--text-muted); margin: 12px 0 0; font-size: 0.85em; }
    .qr-modal-close {
      margin-top: 16px; padding: 10px 28px;
      background: linear-gradient(135deg, var(--accent-from), var(--accent-to));
      color: white; border: none; border-radius: var(--r-full);
      cursor: pointer; font-weight: 600; font-size: 0.9em;
      transition: all 0.25s var(--ease-out);
    }
    .qr-modal-close:hover { transform: scale(1.05); box-shadow: var(--sh-accent); }

    /* 暗色模式 avatar 边框 */
    body.dark-mode .profile-avatar { border-color: rgba(255,154,158,0.5); }

    /* Mobile */
    @media (max-width: 768px) {
      .page-wrap { padding: 32px 20px 60px; }
      .profile-card { padding: 32px 20px; border-radius: var(--r-lg); }
      .profile-avatar { width: 80px; height: 80px; }
      .social-link { padding: 10px 12px; min-width: 64px; font-size: 0.7em; }
    }
  </style>

  <script>
    function showQR(type) {
      var modal = document.getElementById('qrModal');
      var img = document.getElementById('qrImage');
      var title = document.getElementById('qrTitle');
      if (type === 'wechat') { img.src = '/images/wechat-qr.jpg'; title.textContent = '微信扫码添加'; }
      modal.classList.add('active'); document.body.style.overflow = 'hidden';
    }
    function closeQR(e) {
      if (!e || e.target === document.getElementById('qrModal') || e.target.classList.contains('qr-modal-close')) {
        document.getElementById('qrModal').classList.remove('active');
        document.body.style.overflow = '';
      }
    }
    document.addEventListener('keydown', function (e) { if (e.key === 'Escape') closeQR(); });

    function applyDark(d) {
      document.body.classList[d ? 'add' : 'remove']('dark-mode');
      var b = document.querySelector('.dark-toggle');
      if (b) b.textContent = d ? '☀️' : '🌙';
    }
    function toggleDark() {
      var isDark = !document.body.classList.contains('dark-mode');
      applyDark(isDark); localStorage.setItem('dark-mode-manual', isDark);
    }
    (function initDark() {
      var h = new Date().getHours();
      var d = h < 7 || h >= 19;
      var m = localStorage.getItem('dark-mode-manual');
      if (m !== null) d = m === 'true';
      applyDark(d);
    })();
    setInterval(function () {
      var h = new Date().getHours(), m = localStorage.getItem('dark-mode-manual');
      if (m === null) { var ad = h < 7 || h >= 19; if (ad !== document.body.classList.contains('dark-mode')) applyDark(ad); }
    }, 60000);
  </script>
